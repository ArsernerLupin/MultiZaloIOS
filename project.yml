name: MultiZalo
options:
  bundleIdPrefix: com.multizalo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MultiZalo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MultiZalo
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: MultiZalo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "MultiZalo cần quyền truy cập Camera để chụp ảnh hoặc gọi video trên Zalo Web."
        NSMicrophoneUsageDescription: "MultiZalo cần quyền truy cập Micro để gửi tin nhắn thoại hoặc gọi điện trên Zalo Web."
        NSPhotoLibraryUsageDescription: "MultiZalo cần quyền truy cập Thư viện ảnh để gửi hình ảnh và video qua Zalo Web."
        NSPhotoLibraryAddUsageDescription: "MultiZalo cần quyền lưu ảnh và video tải xuống từ Zalo Web vào Thư viện ảnh."
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multizalo.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
